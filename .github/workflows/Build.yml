name: Rakenna AP3K

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Varmista gradlew-skripti
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew-tiedostoa ei löytynyt, luodaan wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Luo Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Release,O=App,C=FI"

      - name: Rakenna Release APK
        env:
          GRADLE_OPTS: "-Xmx4g -Djava.awt.headless=true -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: Zip-align ja Allekirjoita APK (apksigner)
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          $BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out Rakenna_AP3K.apk app-aligned.apk
          
          echo "Allekirjoitettu APK luotu onnistuneesti."
          
