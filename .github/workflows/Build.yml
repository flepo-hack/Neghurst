name: Rakenna AP3K

on:
  push:
    branches:
      - main

# Pakollinen lupa, jotta Action saa luoda julkaisun (Release)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      # The vision engine is real C++ (app/src/main/cpp/CMakeLists.txt) built by
      # the NDK, so the SDK, the exact NDK revision and CMake must all be present
      # or `externalNativeBuild` fails at configure time and the whole build dies
      # with "librendera_native.so is missing". Versions must match
      # `app/build.gradle.kts`.
      - name: Asenna Android SDK, NDK ja CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sdkmanager --licenses <<< 'y' || true

      - name: Luo vaadittu Keystore (my-upload-key.jks)
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Release,O=App,C=FI"

      - name: Luo väliaikainen google-services.json
        run: |
          echo '{
            "project_info": {"project_number": "123","project_id": "dummy"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123:android:123",
                "android_client_info": {"package_name": "com.aistudio.rendera.dodge"}
              },
              "api_key": [{"current_key": "dummy"}]
            }]
          }' > app/google-services.json

      - name: Varmista gradlew-skripti
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Tarkista että natiivinen moottori kääntyy
        run: |
          ./gradlew :app:externalNativeBuildRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace
          # Fail loudly here rather than shipping an APK that cannot detect
          # anything. This is the exact regression that went unnoticed before.
          find app/build -name 'librendera_native.so' | grep -q . \
            || (echo "::error::librendera_native.so was not produced" && exit 1)
          ls -la app/build/intermediates/cxx/release/*/obj/*/librendera_native.so

      - name: Aja yksikkötestit
        run: |
          ./gradlew :app:testReleaseUnitTest \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace

      - name: Yksikkötestien raportti
        if: always()
        run: |
          find app/build/test-results -name '*.xml' -print -exec grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \; || true

      - name: Rakenna ja Allekirjoita APK
        env:
          GRADLE_OPTS: "-Xmx4g -Djava.awt.headless=true -Dorg.gradle.ddaemon=false"
        run: |
          ./gradlew assembleRelease -x lint -x lintVitalRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace

      - name: Etsi ja nimeä valmis APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK-tiedostoa ei löytynyt!"
            exit 1
          fi
          mv "$APK_PATH" Rakenna_AP3K.apk
          ls -la Rakenna_AP3K.apk
          # Report the size and confirm the native payload is actually inside.
          unzip -l Rakenna_AP3K.apk | grep -E 'librendera_native\.so|lib/' || true

      - name: Julkaise APK GitHub Releases -osioon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.${{ github.run_number }}
          name: AP3K Koontiversio #${{ github.run_number }}
          body: "Automaattisesti rakennettu ja allekirjoitettu APK."
          files: Rakenna_AP3K.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
