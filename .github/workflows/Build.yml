name: Rakenna AP3K

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Luo vaadittu Keystore (my-upload-key.jks)
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Release,O=App,C=FI"

      - name: Luo väliaikainen google-services.json (Oikealla pakettinimellä)
        run: |
          echo '{
            "project_info": {"project_number": "123","project_id": "dummy"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123:android:123",
                "android_client_info": {"package_name": "com.aistudio.rendera.dodge"}
              },
              "api_key": [{"current_key": "dummy"}]
            }]
          }' > app/google-services.json

      - name: Varmista gradlew-skripti
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Rakenna ja Allekirjoita APK
        env:
          GRADLE_OPTS: "-Xmx4g -Djava.awt.headless=true -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          ./gradlew assembleRelease -x lint -x lintVitalRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon --stacktrace

      - name: Lataa APK suoraan linkiksi (Ei GitHubiin)
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK-tiedostoa ei löytynyt!"
            exit 1
          fi
          
          mv "$APK_PATH" Rakenna_AP3K.apk
          
          echo "================================================================"
          echo "✅ APK RAKENNETTU JA SIGNATTU ONNISTUNEESTI!"
          echo "================================================================"
          
          echo "🔗 Latauslinkki 1 (BashUpload):"
          curl -T Rakenna_AP3K.apk bashupload.com
          echo ""
          
          echo "🔗 Latauslinkki 2 (Keep.sh):"
          curl -T Rakenna_AP3K.apk https://free.keep.sh/Rakenna_AP3K.apk
          echo ""
          
