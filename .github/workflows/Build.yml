name: Rakenna AP3K

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ap3k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      # The vision engine is real C++ (app/src/main/cpp/CMakeLists.txt) built by
      # the NDK, so the SDK, the exact NDK revision and CMake must all be present
      # or `externalNativeBuild` fails at configure time. The versions here MUST
      # match `app/build.gradle.kts`; if you change one, change the other.
      - name: Asenna Android SDK, NDK ja CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          # Fully qualified path: it is not on PATH in every runner image, and
          # a missing sdkmanager here means the NDK never installs and the native
          # build fails much later with a confusing message.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true