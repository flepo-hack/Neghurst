name: Rakenna AP3K

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ap3k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      # The vision engine is real C++ (app/src/main/cpp/CMakeLists.txt) built by
      # the NDK, so the SDK, the exact NDK revision and CMake must all be present.
      # The NDK revision here MUST match `ndkVersion` in app/build.gradle.kts.
      #
      # sdkmanager is invoked by its fully qualified path: it is not on PATH in
      # every runner image, and when it is missing the NDK silently never
      # installs, so the native build fails much later with a message that points
      # at the wrong thing entirely.
      - name: Asenna Android SDK, NDK ja CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      # ------------------------------------------------------------------
      # Cheap static checks FIRST. They cost seconds and catch the mistakes that
      # otherwise hide behind a multi-minute Android build.
      # ------------------------------------------------------------------
      - name: Tarkista JNI-allekirjoitukset
        run: python3 .github/scripts/check_jni.py

      # Catches wrong member and alias names, which clang only reports after a
      # full NDK configure and compile, and only for the first translation unit
      # it reaches. A real build break of exactly this kind shipped unnoticed.
      - name: Tarkista C++-jäsenten nimet
        run: python3 .github/scripts/check_cpp.py

      # Kotlin mistake classes that the compiler reports at the *use* site, which
      # reads like a classpath problem rather than the field name it is. Each of
      # these cost a full CI cycle; all are cheap to spot by reading.
      - name: Tarkista Kotlin-virheet
        run: python3 .github/scripts/check_kotlin.py

      - name: Tarkista että jokainen .cpp pääsee CMakeLists:iin
        run: |
          set -euo pipefail
          # Every .cpp in src/main/cpp must be reachable from CMakeLists.txt,
          # otherwise it never compiles, which is exactly how a 634 line C++
          # engine sat unbuilt in this project for a long time.
          while read -r src; do
            base="$(basename "$src")"
            if ! grep -qF "$base" app/src/main/cpp/CMakeLists.txt; then
              echo "::error file=$src::not referenced by app/src/main/cpp/CMakeLists.txt"
              exit 1
            fi
          done < <(find app/src/main/cpp -maxdepth 1 -name '*.cpp')

      # Compile the Kotlin main sources on their own, before the NDK build.
      # The Kotlin compile is the fastest way to find a broken classpath or a
      # type error, and it costs seconds where the native build costs a minute.
      # A partial compile classpath - which is what asking for a minor SDK
      # version that is not installed produces - shows up here as every core
      # class going unresolved, rather than several minutes later.
      - name: Luo vaadittu Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Release,O=App,C=FI"

      - name: Luo väliaikainen google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123","project_id": "dummy"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123:android:123",
                "android_client_info": {"package_name": "com.aistudio.rendera.dodge"}
              },
              "api_key": [{"current_key": "dummy"}]
            }]
          }
          JSON

      - name: Varmista gradlew
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Aseta allekirjoitusparametrit
        run: |
          {
            echo "SIGN_STORE=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "SIGN_STORE_PASS=android"
            echo "SIGN_KEY_ALIAS=releasekey"
            echo "SIGN_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Allekirjoitusliput
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          ANDROID_INJECTED_SIGNING_STORE_FILE=$SIGN_STORE
          ANDROID_INJECTED_SIGNING_STORE_PASSWORD=$SIGN_STORE_PASS
          ANDROID_INJECTED_SIGNING_KEY_ALIAS=$SIGN_KEY_ALIAS
          ANDROID_INJECTED_SIGNING_KEY_PASSWORD=$SIGN_KEY_PASS
          EOF

      # ------------------------------------------------------------------
      # Compile the Kotlin main sources on their own, before the NDK build.
      #
      # The Kotlin compile is the fastest way to find a broken classpath or a
      # type error: it takes seconds where the native build takes a minute. A
      # partial compile classpath, which is what asking for a minor SDK version
      # that is not installed produces, shows up here as every core class going
      # unresolved, rather than several minutes later behind a wall of clang.
      # ------------------------------------------------------------------
      - name: Käännä Kotlin-lähdekoodi
        run: |
          set -uo pipefail
          ./gradlew :app:compileDebugKotlin \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon 2>&1 | tee /tmp/kotlin.log
          exit "${PIPESTATUS[0]}"

      - name: Raportoi Kotlin-käännösvirheet
        if: failure()
        run: python3 .github/scripts/dump_log.py /tmp/kotlin.log

      # ------------------------------------------------------------------
      # Compile the native engine on its own, before anything else. A one line
      # JNI typo should fail here in about a minute, not after a full build.
      # ------------------------------------------------------------------
      # Gradle output is thousands of lines and the Actions console truncates
      # it, so a compiler error is easy to miss. The real errors are tee'd to a
      # file and re-emitted as annotations by the step below.
      - name: Käännä natiivinen moottori
        run: |
          set -uo pipefail
          ./gradlew :app:externalNativeBuildRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace 2>&1 | tee /tmp/native.log
          exit "${PIPESTATUS[0]}"

      - name: Raportoi C++-käännösvirheet
        if: failure()
        run: python3 .github/scripts/dump_log.py /tmp/native.log

      # Asserts the engine really was built rather than trusting the exit code.
      #
      # The search is a `find`, not a hard coded path, and that is the whole point
      # of this step being rewritten: a previous version globbed
      # `app/build/intermediates/cxx/release/...`, but AGP drives CMake with
      # **RelWithDebInfo** for a release build, so the directory is named
      # `RelWithDebInfo` and the glob never matched. The build had succeeded and
      # was reported as failed. Guessing a layout is exactly how that happens, so
      # it searches instead, and prints the real layout when it finds nothing so
      # the next failure needs no guesswork either.
      - name: Varmista että moottori todella syntyi
        run: |
          set -uo pipefail
          mapfile -t found < <(find app -name 'librendera_native.so' -type f 2>/dev/null | sort)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::librendera_native.so was not produced; the APK would ship" \
                 "with no vision engine and detect nothing."
            echo "--- app/.cxx ---"
            find app/.cxx -maxdepth 4 -type d 2>/dev/null | head -40
            echo "--- app/build/intermediates ---"
            find app/build/intermediates -maxdepth 2 -type d 2>/dev/null | head -40
            exit 1
          fi

          # Any of these can read the dynamic symbol table. The NDK bundled
          # llvm-readelf is tried after the system one because a runner image is
          # not guaranteed to ship binutils.
          SYMBOLS=""
          for exe in readelf \
                     "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
                     llvm-readelf; do
            if command -v "$exe" >/dev/null 2>&1; then SYMBOLS="$exe"; break; fi
          done

          for so in "${found[@]}"; do
            echo "  $(du -h "$so" | cut -f1)  $so"
            if [ -n "$SYMBOLS" ]; then
              for sym in nativeCreate nativeProcess nativeSetMask; do
                if ! "$SYMBOLS" --dyn-syms --wide "$so" 2>/dev/null | grep -q "$sym"; then
                  echo "::error::$so exports no $sym JNI symbol; Kotlin cannot call it"
                  exit 1
                fi
              done
            else
              echo "  (no readelf available; symbol check deferred to the APK step)"
            fi
          done
          echo "native engine built for ${#found[@]} ABI(s)"

      # The previous command was `:app:testReleaseUnitTest`, which does not
      # exist in AGP 9: the run failed with "Cannot locate tasks that match ...
      # as task 'testReleaseUnitTest' not found", so the tests had not been
      # running at all and every earlier "test" pass proved nothing.
      #
      # `:app:test` is the aggregate task and always exists. This step also lists
      # the real per-variant task names, so the next person does not have to
      # guess a task name either.
      - name: Luo testitehtävät
        run: |
          set -uo pipefail
          ./gradlew :app:tasks --all 2>&1 | tee /tmp/tasks.log >/dev/null
          echo "--- unit test tasks available ---"
          grep -iE "^test.*UnitTest" /tmp/tasks.log | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          count=$(grep -ciE "^test.*UnitTest" /tmp/tasks.log || true)
          echo "::notice::$count unit test task(s) found"
          if [ "$count" -lt 1 ]; then
            echo "::error::no unit test task exists in this build; the tests cannot run"
            exit 1
          fi

      - name: Aja yksikkötestit
        run: |
          set -uo pipefail
          ./gradlew :app:test \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace 2>&1 | tee /tmp/test.log
          exit "${PIPESTATUS[0]}"

      # Without this, a Kotlin compile error in the test sources is buried in a
      # truncated console and the only visible symptom is a bare exit code.
      - name: Raportoi käännösvirheet ja testitulokset
        if: failure()
        run: python3 .github/scripts/dump_log.py /tmp/test.log

      - name: Yksikkötestien tulos
        if: always()
        run: |
          python3 .github/scripts/report_tests.py

      - name: Rakenna ja allekirjoita APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -x lint -x lintVitalRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Tarkista APK ja julkaise
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          # The single most important check in this workflow. This project spent a
          # long time shipping an APK with no native library and no way to detect
          # anything, so assert the payload is really inside.
          if ! unzip -l "$APK_PATH" | grep -q 'librendera_native.so'; then
            echo "::error::APK contains no librendera_native.so; it cannot detect anything"
            exit 1
          fi
          echo "native payload in APK:"
          unzip -l "$APK_PATH" | grep 'librendera_native.so' | awk '{print "  " $1 "  " $4}'

          # Check the library that actually ships, for every packaged ABI. This
          # is path independent and is the contract that matters, so it is the
          # real gate; the build-directory step above is only a fast failure.
          rm -rf apk_libs && mkdir -p apk_libs
          unzip -o -q "$APK_PATH" 'lib/*/librendera_native.so' -d apk_libs
          abis=$(find apk_libs/lib -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "ABIs packaged: $abis"
          if [ "$abis" -lt 1 ]; then
            echo "::error::no native library for any ABI inside the APK"
            exit 1
          fi
          for so in apk_libs/lib/*/librendera_native.so; do
            if command -v readelf >/dev/null 2>&1; then
              for sym in nativeCreate nativeProcess; do
                if ! readelf --dyn-syms --wide "$so" | grep -q "$sym"; then
                  echo "::error::$so has no $sym symbol"
                  exit 1
                fi
              done
            fi
            echo "  verified $so ($(du -h "$so" | cut -f1))"
          done
          echo "total size: $(du -h "$APK_PATH" | cut -f1)"

          mv "$APK_PATH" Rakenna_AP3K.apk
          ls -la Rakenna_AP3K.apk

      - name: Julkaise APK GitHub Releases -osioon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.${{ github.run_number }}
          name: AP3K Koontiversio #${{ github.run_number }}
          body: "Automaattisesti rakennettu ja allekirjoitettu APK."
          files: Rakenna_AP3K.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
