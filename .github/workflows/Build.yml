name: Rakenna AP3K

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ap3k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Asenna ja kätkötä Gradle
        uses: gradle/actions/setup-gradle@v4

      # The vision engine is real C++ (app/src/main/cpp/CMakeLists.txt) built by
      # the NDK, so the SDK, the exact NDK revision and CMake must all be present
      # or `externalNativeBuild` fails at configure time. The versions here MUST
      # match `app/build.gradle.kts`; if you change one, change the other.
      - name: Asenna Android SDK, NDK ja CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true

      # ------------------------------------------------------------------
      # Cheap static checks FIRST. These cost seconds and catch the mistakes that
      # otherwise hide behind a multi-minute Android build.
      # ------------------------------------------------------------------
      - name: Tarkista JNI-allekirjoitukset
        run: |
          set -euo pipefail
          python3 .github/scripts/check_jni.py

      - name: Tarkista CMake-lähdelista
        run: |
          set -euo pipefail
          # Every .cpp in src/main/cpp must be reachable from CMakeLists.txt,
          # otherwise it silently never compiles, which is exactly how a 634 line
          # C++ engine went unbuilt in this project before.
          while read -r src; do
            base="$(basename "$src")"
            if ! grep -qF "$base" app/src/main/cpp/CMakeLists.txt; then
              echo "::error file=$src::not referenced by app/src/main/cpp/CMakeLists.txt"
              exit 1
            fi
          done < <(find app/src/main/cpp -maxdepth 1 -name '*.cpp')

      - name: Luo vaadittu Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Release,O=App,C=FI"

      - name: Luo väliaikainen google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123","project_id": "dummy"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123:android:123",
                "android_client_info": {"package_name": "com.aistudio.rendera.dodge"}
              },
              "api_key": [{"current_key": "dummy"}]
            }]
          }
          JSON

      - name: Varmista gradlew
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Aseta allekirjoitusparametrit
        run: |
          {
            echo "ANDROID_INJECTED_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "ANDROID_INJECTED_SIGNING_STORE_PASSWORD=android"
            echo "ANDROID_INJECTED_SIGNING_KEY_ALIAS=releasekey"
            echo "ANDROID_INJECTED_SIGNING_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Compile the native engine on its own, before anything else. A one line
      # JNI typo should fail here in about a minute, not after a full build.
      # ------------------------------------------------------------------
      - name: Käännä natiivinen moottori
        run: |
          set -euo pipefail
          ./gradlew :app:externalNativeBuildRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Varmista että moottori todella syntyi
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(app/build/intermediates/cxx/release/*/obj/*/librendera_native.so)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::librendera_native.so was not produced. The APK would ship" \
                 "with no vision engine and detect nothing."
            exit 1
          fi
          for so in "${found[@]}"; do
            echo "  $(du -h "$so" | cut -f1)  $so"
            # A .so with no symbol table is usually a stub.
            if ! readelf -sW "$so" | grep -q 'Java_com_example_vision_nativebridge_NativeVisionEngine_nativeProcess'; then
              echo "::error::$so has no nativeProcess JNI symbol"
              exit 1
            fi
          done

      - name: Aja yksikkötestit
        run: |
          set -euo pipefail
          ./gradlew :app:testReleaseUnitTest \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Yksikkötestien tulos
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          if not files:
              print('::warning::no test result XML found')
              sys.exit(0)
          total = fail = err = skip = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
          print(f'tests={total} failures={fail} errors={err} skipped={skip}')
          if fail or err:
              for f in files:
                  r = ET.parse(f).getroot()
                  for tc in r.iter('testcase'):
                      for bad in list(tc.iter('failure')) + list(tc.iter('error')):
                          print(f"::error::{r.get('name')}.{tc.get('name')}")
                          print((bad.text or '')[:1500])
              sys.exit(1)
          PY

      - name: Rakenna ja allekirjoita APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -x lint -x lintVitalRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_INJECTED_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_INJECTED_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_INJECTED_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_INJECTED_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Tarkista APK ja julkaise
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          # The single most important check in this workflow. A previous version of
          # this project shipped for a long time with no native library at all and
          # no way to detect anything, so assert the payload is really in there.
          if ! unzip -l "$APK_PATH" | grep -q 'librendera_native.so'; then
            echo "::error::APK contains no librendera_native.so; it cannot detect anything"
            exit 1
          fi
          echo "native payload in APK:"
          unzip -l "$APK_PATH" | grep 'librendera_native.so' | awk '{print "  " $1 "  " $4}'

          echo "total size: $(du -h "$APK_PATH" | cut -f1)"

          # Class-change sanity: the vision classes must not have been stripped.
          if command -v dexdump >/dev/null 2>&1; then
            unzip -o -q "$APK_PATH" 'classes*.dex' -d apk_check
            for cls in "Lcom/example/vision/ScreenThreatDetector;" "Lcom/example/vision/CollisionSolver;"; do
              if ! grep -qa "$cls" apk_check/*.dex; then
                echo "::warning::$cls not found in the dex"
              fi
            done
          fi

          mv "$APK_PATH" Rakenna_AP3K.apk
          ls -la Rakenna_AP3K.apk

      - name: Julkaise APK GitHub Releases -osioon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.${{ github.run_number }}
          name: AP3K Koontiversio #${{ github.run_number }}
          body: "Automaattisesti rakennettu ja allekirjoitettu APK."
          files: Rakenna_AP3K.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
