name: Opi Rendera -lokeista

# Folds device-reported logs into docs/LEARNING.md.
#
# The app cannot push to a repository itself: that needs a GitHub personal
# access token inside the APK, and a token in a published APK is public the
# moment the APK is uploaded. So this runs when someone commits a log, and the
# repository keeps the history.
#
# To contribute: in game long press the bubble, SEND DIAGNOSTICS, then commit the
# file as diagnostics/<anything>.jsonl and open a pull request.

on:
  push:
    branches: [main]
    paths: ['diagnostics/*.jsonl']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rendera-learning
  cancel-in-progress: true

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ajaa raportin taitto
        run: python3 .github/scripts/fold_learning.py

      - name: Varmista etta raportti syntyi
        run: |
          if [ ! -s docs/LEARNING.md ]; then
            echo "docs/LEARNING.md was not produced"
            exit 1
          fi
          head -30 docs/LEARNING.md

      - name: Commitoi raportti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEARNING.md
          if git diff --cached --quiet; then
            echo "no change to report"
            exit 0
          fi
          git commit -m "chore(learning): fold device diagnostics into LEARNING.md"
          git push origin HEAD:main
